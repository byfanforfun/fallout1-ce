name: Build

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

defaults:
  run:
    shell: bash

jobs:
  static-analysis:
    name: Static analysis

    runs-on: ubuntu-latest

    steps:
      - name: Install
        run: |
          sudo apt update
          sudo apt install cppcheck

      - name: Clone
        uses: actions/checkout@v4

      - name: cppcheck
        run: cppcheck --std=c++17 src/

  code-format:
    name: Code format check

    runs-on: ubuntu-latest

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: clang-format
        run: |
          pip install clang-format==21.1.8
          find src -type f \( -name '*.cc' -o -name '*.h' \) -print0 | xargs -0 clang-format --dry-run --Werror

  android:
    name: Android

    runs-on: ubuntu-latest

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 11
          cache: gradle

      - name: Cache cmake build
        uses: actions/cache@v4
        with:
          path: os/android/app/.cxx
          key: android-cmake-v1

      - name: Setup signing config
        if: env.KEYSTORE_FILE_BASE64 != '' && env.KEYSTORE_PROPERTIES_FILE_BASE64 != ''
        run: |
          cd os/android
          echo "$KEYSTORE_FILE_BASE64" | base64 --decode > debug.keystore
          echo "$KEYSTORE_PROPERTIES_FILE_BASE64" | base64 --decode > debug-keystore.properties
        env:
          KEYSTORE_FILE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_FILE_BASE64 }}
          KEYSTORE_PROPERTIES_FILE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PROPERTIES_FILE_BASE64 }}

      - name: Build
        run: |
          cd os/android
          ./gradlew assembleDebug

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fallout-ce-debug.apk
          path: os/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  ios:
    name: iOS

    runs-on: macos-14

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Cache cmake build
        uses: actions/cache@v4
        with:
          path: build
          key: ios-cmake-v3

      - name: Configure
        run: |
          cmake \
            -B build \
            -D CMAKE_BUILD_TYPE=RelWithDebInfo \
            -D CMAKE_TOOLCHAIN_FILE=cmake/toolchain/ios.toolchain.cmake \
            -D ENABLE_BITCODE=0 \
            -D PLATFORM=OS64 \
            -G Xcode \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY='' \
            # EOL

      - name: Build
        run: |
          cmake \
            --build build \
            --config RelWithDebInfo \
            -j $(sysctl -n hw.physicalcpu) \
            # EOL

      - name: Pack
        run: |
          cd build
          cpack -C RelWithDebInfo

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fallout-ce.ipa
          path:  build/fallout-ce.ipa
          retention-days: 7

  linux:
    name: Linux (${{ matrix.arch }})

    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86
          - x64

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Dependencies (x86)
        if: matrix.arch == 'x86'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt-get install -y --fix-broken
          sudo apt-get install -t noble -y --no-install-recommends libpcre2-8-0:i386 g++-multilib libsdl2-dev:i386 zlib1g-dev:i386

      - name: Dependencies (x64)
        if: matrix.arch == 'x64'
        run: |
          sudo apt update
          sudo apt install libsdl2-dev zlib1g-dev

      - name: Cache cmake build
        uses: actions/cache@v4
        with:
          path: build
          key: linux-${{ matrix.arch }}-cmake-v2

      - name: Configure (x86)
        if: matrix.arch == 'x86'
        run: |
          cmake \
            -B build \
            -D CMAKE_BUILD_TYPE=RelWithDebInfo \
            -D CMAKE_TOOLCHAIN_FILE=cmake/toolchain/Linux32.cmake \
            # EOL

      - name: Configure (x64)
        if: matrix.arch == 'x64'
        run: |
          cmake \
            -B build \
            -D CMAKE_BUILD_TYPE=RelWithDebInfo \
            # EOL

      - name: Build
        run: |
          cmake \
            --build build \
            -j $(nproc) \
            # EOL

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fallout-ce-linux-${{ matrix.arch }}
          path:  build/fallout-ce
          retention-days: 7

  linux-aarch64:
    name: Linux (aarch64 + RetroArch)

    runs-on: ubuntu-24.04

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt update
          sudo apt install crossbuild-essential-arm64 zlib1g-dev:arm64

      - name: Cache cmake build
        uses: actions/cache@v4
        with:
          path: build
          key: linux-aarch64-cmake-v1

      - name: Configure
        run: |
          cmake \
            -B build \
            -D CMAKE_BUILD_TYPE=RelWithDebInfo \
            -D CMAKE_TOOLCHAIN_FILE=cmake/toolchain/aarch64-linux-gnu.cmake \
            -D CMAKE_FIND_ROOT_PATH=/usr/aarch64-linux-gnu \
            -D CMAKE_PREFIX_PATH=/usr/aarch64-linux-gnu \
            -D FALLOUT_RETROARCH=ON \
            # EOL

      - name: Build
        run: |
          cmake \
            --build build \
            -j $(nproc) \
            # EOL

      - name: Verify
        run: |
          file build/fallout-ce
          readelf -A build/fallout-ce | grep Tag_CPU_arch

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fallout-ce-linux-aarch64-retroarch
          path:  build/fallout-ce
          retention-days: 7

  linux-aarch64-r36:
    name: Linux (aarch64, r36)

    runs-on: ubuntu-24.04

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt update
          sudo apt install -y g++-12-aarch64-linux-gnu debootstrap qemu-user-static

      - name: Cache bookworm sysroot
        id: sysroot-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/aarch64-bk12
          key: bookworm-arm64-sysroot-v1

      - name: Build bookworm sysroot
        if: steps.sysroot-cache.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /home/runner/aarch64-bk12
          sudo debootstrap --arch=arm64 --foreign bookworm /home/runner/aarch64-bk12 https://deb.debian.org/debian
          sudo cp /usr/bin/qemu-aarch64-static /home/runner/aarch64-bk12/usr/bin/
          sudo chroot /home/runner/aarch64-bk12 /debootstrap/debootstrap --second-stage
          sudo chroot /home/runner/aarch64-bk12 bash -c 'apt-get update && apt-get install -y libc6-dev libstdc++-12-dev zlib1g-dev libdrm-dev libgbm-dev libudev-dev libasound2-dev'
          sudo mkdir -p /home/runner/aarch64-bk12/usr/lib64
          sudo ln -sfv /home/runner/aarch64-bk12/usr/lib/aarch64-linux-gnu/{crt1.o,Scrt1.o,crti.o,crtn.o} /home/runner/aarch64-bk12/usr/lib64/
          sudo ln -sfv libpthread.so.0 /home/runner/aarch64-bk12/usr/lib64/libpthread.so
          sudo ln -sfv /home/runner/aarch64-bk12/usr/lib/gcc/aarch64-linux-gnu/12/libstdc++.a /home/runner/aarch64-bk12/usr/lib64/libstdc++.a

      - name: Cache cmake build
        uses: actions/cache@v4
        with:
          path: build
          key: linux-aarch64-r36-cmake-v2

      - name: Configure
        run: |
          cmake \
            -B build \
            -D CMAKE_BUILD_TYPE=RelWithDebInfo \
            -D CMAKE_TOOLCHAIN_FILE=cmake/toolchain/aarch64-linux-gnu.cmake \
            -D CMAKE_SYSROOT=/home/runner/aarch64-bk12 \
            -D CMAKE_FIND_ROOT_PATH=/home/runner/aarch64-bk12 \
            -D CMAKE_PREFIX_PATH=/home/runner/aarch64-bk12/usr \
            -D CMAKE_C_COMPILER=/usr/bin/aarch64-linux-gnu-gcc-12 \
            -D CMAKE_CXX_COMPILER=/usr/bin/aarch64-linux-gnu-g++-12 \
            -D FALLOUT_RETROARCH=ON \
            # EOL

      - name: Build
        run: |
          cmake \
            --build build \
            -j $(nproc) \
            # EOL

      - name: Verify
        run: |
          file build/fallout-ce
          readelf -A build/fallout-ce | grep Tag_CPU_arch
          readelf -d build/fallout-ce | grep NEEDED
          objdump -T build/fallout-ce | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -3

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fallout-ce-aarch64-r36
          path:  build/fallout-ce
          retention-days: 7

  macos:
    name: macOS

    runs-on: macos-14

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Cache cmake build
        uses: actions/cache@v4
        with:
          path: build
          key: macos-cmake-v5

      - name: Configure
        run: |
          cmake \
            -B build \
            -G Xcode \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY='' \
            # EOL

      - name: Build
        run: |
          cmake \
            --build build \
            --config RelWithDebInfo \
            -j $(sysctl -n hw.physicalcpu) \
            # EOL

      - name: Pack
        run: |
          cd build
          cpack -C RelWithDebInfo

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fallout-ce-macos.dmg
          path:  build/Fallout Community Edition.dmg
          retention-days: 7

  windows:
    name: Windows (${{ matrix.arch }})

    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            generator-platform: Win32
          - arch: x64
            generator-platform: x64

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Cache cmake build
        uses: actions/cache@v4
        with:
          path: build
          key: windows-${{ matrix.arch }}-cmake-v2

      - name: Configure
        run: |
          cmake \
            -B build \
            -G "Visual Studio 17 2022" \
            -A ${{ matrix.generator-platform }} \
            # EOL

      - name: Build
        run: |
          cmake \
            --build build \
            --config RelWithDebInfo \
            # EOL

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fallout-ce-windows-${{ matrix.arch }}
          path:  build/RelWithDebInfo/fallout-ce.exe
          retention-days: 7
