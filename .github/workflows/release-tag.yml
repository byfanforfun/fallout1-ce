name: Release (tag)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: write

jobs:
  create-release:
    name: Create release

    runs-on: ubuntu-latest

    steps:
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create -R "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" --generate-notes || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  game-data:
    name: Game data

    runs-on: ubuntu-latest

    steps:
      - name: Clone game assets
        uses: actions/checkout@v4
        with:
          repository: byfanforfun/fallout1-kiosk-assets
          token: ${{ secrets.ASSETS_TOKEN || github.token }}
          path: assets

      - name: Pack
        run: |
          cd assets/game
          zip -r ../../fallout1-ce-kiosk-game.zip .

      - name: Upload
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release upload -R "$GITHUB_REPOSITORY" --clobber "$GITHUB_REF_NAME" fallout1-ce-kiosk-game.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    name: Android

    needs: create-release

    runs-on: ubuntu-latest

    steps:
      - name: Clone
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 11
          cache: gradle

      - name: Cache cmake build
        uses: actions/cache@v4
        with:
          path: os/android/app/.cxx
          key: android-cmake-v1

      - name: Setup signing config
        if: env.KEYSTORE_FILE_BASE64 != '' && env.KEYSTORE_PROPERTIES_FILE_BASE64 != ''
        run: |
          cd os/android
          echo "$KEYSTORE_FILE_BASE64" | base64 --decode > release.keystore
          echo "$KEYSTORE_PROPERTIES_FILE_BASE64" | base64 --decode > release-keystore.properties
        env:
          KEYSTORE_FILE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_FILE_BASE64 }}
          KEYSTORE_PROPERTIES_FILE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PROPERTIES_FILE_BASE64 }}

      - name: Build
        run: |
          cd os/android
          ./gradlew assembleRelease

      - name: Upload
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          apk=$(find os/android/app/build/outputs/apk -maxdepth 2 -name 'app-*.apk' | head -n1)
          if [ -z "$apk" ]; then
            echo "no release apk found"
            ls -R os/android/app/build/outputs/apk || true
            exit 1
          fi
          cp "$apk" fallout1-ce-kiosk-android.apk
          gh release upload -R "$GITHUB_REPOSITORY" --clobber "$GITHUB_REF_NAME" fallout1-ce-kiosk-android.apk
          rm fallout1-ce-kiosk-android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ios:
    name: iOS

    needs: create-release

    runs-on: macos-14

    steps:
      - name: Clone
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Cache cmake build
        uses: actions/cache@v4
        with:
          path: build
          key: ios-cmake-v2

      - name: Configure
        run: |
          cmake \
            -B build \
            -D CMAKE_TOOLCHAIN_FILE=cmake/toolchain/ios.toolchain.cmake \
            -D DEPLOYMENT_TARGET=12.0 \
            -D ENABLE_BITCODE=0 \
            -D PLATFORM=OS64 \
            -G Xcode \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY='' \
            # EOL


      - name: Build
        run: |
          cmake \
            --build build \
            --config RelWithDebInfo \
            -j $(sysctl -n hw.physicalcpu) \
            # EOL

      - name: Pack
        run: |
          cd build
          cpack -C RelWithDebInfo

      - name: Upload
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd build
          cp fallout-ce.ipa fallout1-ce-kiosk-ios.ipa
          gh release upload -R "$GITHUB_REPOSITORY" --clobber "$GITHUB_REF_NAME" fallout1-ce-kiosk-ios.ipa
          rm fallout1-ce-kiosk-ios.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux:
    name: Linux (${{ matrix.arch }})

    needs: create-release

    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86
          - x64

    steps:
      - name: Clone
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Dependencies (x86)
        if: matrix.arch == 'x86'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt-get install -y --fix-broken
          sudo apt-get install -t noble -y --no-install-recommends libpcre2-8-0:i386 g++-multilib libsdl2-dev:i386 zlib1g-dev:i386

      - name: Dependencies (x64)
        if: matrix.arch == 'x64'
        run: |
          sudo apt update
          sudo apt install libsdl2-dev zlib1g-dev

      - name: Cache cmake build
        uses: actions/cache@v4
        with:
          path: build
          key: linux-${{ matrix.arch }}-cmake-v2

      - name: Configure (x86)
        if: matrix.arch == 'x86'
        run: |
          cmake \
            -B build \
            -D CMAKE_BUILD_TYPE=RelWithDebInfo \
            -D CMAKE_TOOLCHAIN_FILE=cmake/toolchain/Linux32.cmake \
            # EOL

      - name: Configure (x64)
        if: matrix.arch == 'x64'
        run: |
          cmake \
            -B build \
            -D CMAKE_BUILD_TYPE=RelWithDebInfo \
            # EOL

      - name: Build
        run: |
          cmake \
            --build build \
            -j $(nproc) \
            # EOL

      - name: Upload
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd build
          tar -czvf fallout1-ce-kiosk-linux-${{ matrix.arch }}.tar.gz fallout-ce
          gh release upload -R "$GITHUB_REPOSITORY" --clobber "$GITHUB_REF_NAME" fallout1-ce-kiosk-linux-${{ matrix.arch }}.tar.gz
          rm fallout1-ce-kiosk-linux-${{ matrix.arch }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux-aarch64-r36:
    name: Linux (aarch64, r36)

    needs: create-release

    runs-on: ubuntu-24.04

    steps:
      - name: Clone
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Dependencies
        run: |
          sudo apt update
          sudo apt install -y g++-12-aarch64-linux-gnu debootstrap qemu-user-static

      - name: Cache bookworm sysroot
        id: sysroot-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/aarch64-bk12
          key: bookworm-arm64-sysroot-v1

      - name: Build bookworm sysroot
        if: steps.sysroot-cache.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /home/runner/aarch64-bk12
          sudo debootstrap --arch=arm64 --foreign bookworm /home/runner/aarch64-bk12 https://deb.debian.org/debian
          sudo cp /usr/bin/qemu-aarch64-static /home/runner/aarch64-bk12/usr/bin/
          sudo chroot /home/runner/aarch64-bk12 /debootstrap/debootstrap --second-stage
          sudo chroot /home/runner/aarch64-bk12 bash -c 'apt-get update && apt-get install -y libc6-dev libstdc++-12-dev zlib1g-dev libdrm-dev libgbm-dev libudev-dev libasound2-dev'
          sudo mkdir -p /home/runner/aarch64-bk12/usr/lib64
          sudo ln -sfv /home/runner/aarch64-bk12/usr/lib/aarch64-linux-gnu/{crt1.o,Scrt1.o,crti.o,crtn.o} /home/runner/aarch64-bk12/usr/lib64/
          sudo ln -sfv libpthread.so.0 /home/runner/aarch64-bk12/usr/lib64/libpthread.so
          sudo ln -sfv /home/runner/aarch64-bk12/usr/lib/gcc/aarch64-linux-gnu/12/libstdc++.a /home/runner/aarch64-bk12/usr/lib64/libstdc++.a

      - name: Cache cmake build
        uses: actions/cache@v4
        with:
          path: build
          key: linux-aarch64-r36-cmake-v2

      - name: Configure
        run: |
          cmake \
            -B build \
            -D CMAKE_BUILD_TYPE=RelWithDebInfo \
            -D CMAKE_TOOLCHAIN_FILE=cmake/toolchain/aarch64-linux-gnu.cmake \
            -D CMAKE_SYSROOT=/home/runner/aarch64-bk12 \
            -D CMAKE_FIND_ROOT_PATH=/home/runner/aarch64-bk12 \
            -D CMAKE_PREFIX_PATH=/home/runner/aarch64-bk12/usr \
            -D CMAKE_C_COMPILER=/usr/bin/aarch64-linux-gnu-gcc-12 \
            -D CMAKE_CXX_COMPILER=/usr/bin/aarch64-linux-gnu-g++-12 \
            -D FALLOUT_RETROARCH=ON \
            # EOL

      - name: Build
        run: |
          cmake \
            --build build \
            -j $(nproc) \
            # EOL

      - name: Verify
        run: |
          file build/fallout-ce
          readelf -A build/fallout-ce | grep Tag_CPU_arch
          readelf -d build/fallout-ce | grep NEEDED
          objdump -T build/fallout-ce | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -3

      - name: Upload
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd build
          tar -czvf fallout1-ce-kiosk-linux-aarch64-r36.tar.gz fallout-ce
          gh release upload -R "$GITHUB_REPOSITORY" --clobber "$GITHUB_REF_NAME" fallout1-ce-kiosk-linux-aarch64-r36.tar.gz
          rm fallout1-ce-kiosk-linux-aarch64-r36.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    name: macOS

    needs: create-release

    runs-on: macos-14

    steps:
      - name: Clone
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Import code signing certificates
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_FILE_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_PASSWORD }}

      - name: Cache cmake build
        uses: actions/cache@v4
        with:
          path: build
          key: macos-cmake-v4

      - name: Configure
        run: |
          cmake \
            -B build \
            -G Xcode \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="${{ secrets.APPLE_DEVELOPER_CERTIFICATE_IDENTITY }}" \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGN_INJECT_BASE_ENTITLEMENTS="NO" \
            -D CMAKE_XCODE_ATTRIBUTE_OTHER_CODE_SIGN_FLAGS="--options=runtime --timestamp" \
            # EOL

      - name: Build
        run: |
          cmake \
            --build build \
            --config RelWithDebInfo \
            -j $(sysctl -n hw.physicalcpu) \
            # EOL

      - name: Pack
        run: |
          cd build
          cpack -C RelWithDebInfo

      - name: Notarize
        run: |
          brew install mitchellh/gon/gon
          cat << EOF > config.json
          {
            "notarize": {
              "path": "build/Fallout Community Edition.dmg",
              "bundle_id": "$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "build/RelWithDebInfo/Fallout Community Edition.app/Contents/Info.plist")",
              "staple": true
            }
          }
          EOF
          gon config.json
          rm config.json
        env:
          AC_USERNAME: ${{ secrets.APPLE_DEVELOPER_AC_USERNAME }}
          AC_PASSWORD: ${{ secrets.APPLE_DEVELOPER_AC_PASSWORD }}

      - name: Upload
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd build
          cp "Fallout Community Edition.dmg" fallout1-ce-kiosk-macos.dmg
          gh release upload -R "$GITHUB_REPOSITORY" --clobber "$GITHUB_REF_NAME" fallout1-ce-kiosk-macos.dmg
          rm fallout1-ce-kiosk-macos.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    name: Windows (${{ matrix.arch }})

    needs: create-release

    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            generator-platform: Win32
          - arch: x64
            generator-platform: x64

    steps:
      - name: Clone
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Cache cmake build
        uses: actions/cache@v4
        with:
          path: build
          key: windows-${{ matrix.arch }}-cmake-v2

      - name: Configure
        run: |
          cmake \
            -B build \
            -G "Visual Studio 17 2022" \
            -A ${{ matrix.generator-platform }} \
            # EOL

      - name: Build
        run: |
          cmake \
            --build build \
            --config RelWithDebInfo \
            # EOL

      - name: Upload
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd build/RelWithDebInfo
          7z a fallout1-ce-kiosk-windows-${{ matrix.arch }}.zip fallout-ce.exe
          gh release upload -R "$GITHUB_REPOSITORY" --clobber "$GITHUB_REF_NAME" fallout1-ce-kiosk-windows-${{ matrix.arch }}.zip
          rm fallout1-ce-kiosk-windows-${{ matrix.arch }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}